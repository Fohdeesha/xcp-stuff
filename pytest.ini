[pytest]
pythonpath = src
testpaths = tests
# No cache: on a Windows dev box with the repo on an SMB share, pytest cannot create its
# cache there, and its cleanup path then leaves undeletable pytest-cache-files-* directories
# behind - owned by a Unix uid the SMB session has no right to remove, which nothing on the
# Windows side can touch, local admin included, since the Samba server is what enforces the
# permissions. The cache buys nothing for a suite this size, so it stays off.
addopts = -p no:cacheprovider
